[package]
name = "derouter"
version = "0.1.0"
edition = "2021"
description = "AI proxy-fallback router — Rust rewrite"

[[bin]]
name = "derouter"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
bytes = "1"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"


# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth
jsonwebtoken = "9"
argon2 = "0.5"
bcrypt = "0.15"
tower-cookies = "0.10"
time = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
async-stream = "0.3"

# Misc
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4", "v5"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
dirs = "5"
dashmap = "6"
toml = "0.8"
crc32fast = "1"
flate2 = "1"
axum-extra = "0.10"
url = "2"

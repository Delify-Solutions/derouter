<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — derouter</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/htmx.min.js"></script>
    <script defer src="/alpine.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 h-full flex items-center justify-center">
    <div class="w-full max-w-sm">
        <h1 class="text-2xl font-bold mb-6 text-center">derouter</h1>
        <form method="POST" action="/login" class="bg-white shadow-md rounded-lg p-6 space-y-4">
            {% if let Some(e) = error %}
            <div class="text-red-600 text-sm">{{ e }}</div>
            {% endif %}
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white rounded px-3 py-2 hover:bg-blue-700">
                Login
            </button>
        </form>
    </div>
</body>
</html>

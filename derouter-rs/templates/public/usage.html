<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derouter — Key Usage</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@4.0.0/distsolone.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-xl font-semibold">Derouter</h1>
                <p class="text-xs text-gray-500 mt-0.5">Key Usage</p>
            </div>
        </div>

        <!-- Key entry form -->
        <div class="rounded-lg border border-gray-200 bg-white p-4 mb-4" x-data="{ showForm: true }">
            <form x-show="showForm" hx-get="/usage/key/receipts"
                  hx-target="#usage-content"
                  hx-swap="innerHTML"
                  hx-vals='{"period": "7d"}'
                  @htmx:after-request="if (event.detail.xhr.status === 404) { $refs.errorMsg.textContent = 'Key not found'; } else { showForm = false; }">
                <label class="block text-sm font-medium mb-1.5">Enter your API key</label>
                <input type="text" name="key" placeholder="sk-..."
                       class="w-full py-2.5 px-3 text-sm bg-gray-50 border border-gray-300 rounded-lg font-mono focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500/40"
                       x-ref="keyInput" />
                <p x-ref="errorMsg" class="text-sm text-red-500 mt-2"></p>
                <button type="submit"
                        class="mt-3 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-medium hover:opacity-90">
                    View Usage
                </button>
            </form>
        </div>

        <!-- Usage content loaded via HTMX -->
        <div id="usage-content"></div>
    </div>
</body>
</html>

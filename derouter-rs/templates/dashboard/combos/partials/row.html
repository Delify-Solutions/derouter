<tr id="combo-row-{{ item.id }}" class="border-b hover:bg-gray-50">
    <td class="px-4 py-3 text-sm font-medium">{{ item.name }}</td>
    <td class="px-4 py-3 text-sm">{{ item.kind }}</td>
    <td class="px-4 py-3 text-sm">
        {% if item.models_count == 0 %}
        <span class="text-gray-400">No models</span>
        {% else %}
        <span class="text-xs">{{ item.models_count }} models</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-sm">
        <button hx-get="/dashboard/combos/{{ item.id }}"
                hx-target="#modal-container"
                class="text-blue-600 hover:underline mr-2">Edit</button>
        <button hx-post="/dashboard/combos/{{ item.name }}/test"
                hx-target="#test-result-{{ item.id }}"
                hx-swap="innerHTML"
                class="text-green-600 hover:underline mr-2">Test</button>
        <button hx-delete="/dashboard/combos/{{ item.id }}"
                hx-target="#combo-row-{{ item.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this combo?"
                class="text-red-600 hover:underline">Delete</button>
    </td>
</tr>
<tr id="test-result-{{ item.id }}"></tr>

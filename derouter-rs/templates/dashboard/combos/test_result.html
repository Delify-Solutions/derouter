<td colspan="4" class="px-4 py-3 bg-gray-50">
    {% if success %}
    <div class="flex items-start space-x-3">
        <div class="flex-shrink-0 text-green-600 font-bold text-sm">SUCCESS</div>
        <div class="flex-1">
            <div class="text-xs text-gray-500">Latency: {{ latency_ms }}ms</div>
            {% if !reply.is_empty() %}
            <div class="text-sm mt-1 text-gray-800">{{ reply }}</div>
            {% endif %}
        </div>
    </div>
    {% else %}
    <div class="flex items-start space-x-3">
        <div class="flex-shrink-0 text-red-600 font-bold text-sm">FAILED</div>
        <div class="flex-1">
            {% if !error.is_empty() %}
            <div class="text-sm text-red-600">{{ error }}</div>
            {% endif %}
            <div class="text-xs text-gray-500 mt-1">Latency: {{ latency_ms }}ms</div>
        </div>
    </div>
    {% endif %}
</td>

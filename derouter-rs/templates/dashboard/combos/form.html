<div x-data="{ open: true }" x-show="open" class="fixed inset-0 z-50 flex items-center justify-center">
    <div x-show="open" @click="open = false" class="absolute inset-0 bg-black opacity-40"></div>
    <div x-show="open" class="relative bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-4 border-b">
            <h2 class="text-lg font-bold">{{ is_edit }} Combo</h2>
            <button @click="open = false"
                    class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        <form {% if is_edit == "Edit" %}
                hx-put="/dashboard/combos/{{ combo_id }}"
              {% else %}
                hx-post="/dashboard/combos"
              {% endif %}
                hx-target="#modal-container"
                class="p-4 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Name *</label>
                <input type="text" name="name" value="{{ name }}" required
                       pattern="[a-zA-Z0-9_.\-]+"
                       class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Kind</label>
                <select name="kind" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="" {% if kind.is_empty() %}selected{% endif %}>Default (LLM)</option>
                    <option value="llm" {% if kind == "llm" %}selected{% endif %}>LLM</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Models (one per line, format: providerName/modelId)</label>
                <textarea name="models" rows="6"
                          placeholder="openai/gpt-4o&#10;anthropic/claude-3-opus"
                          class="w-full border border-gray-300 rounded px-3 py-2 font-mono text-sm">{{ models_text }}</textarea>
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <button type="button" @click="open = false"
                        class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">{{ is_edit }}</button>
            </div>
        </form>
    </div>
</div>

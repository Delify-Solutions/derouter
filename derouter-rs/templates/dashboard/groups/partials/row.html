<tr id="group-row-{{ item.id }}" class="border-b hover:bg-gray-50">
    <td class="px-4 py-3 text-sm font-medium">{{ item.name }}</td>
    <td class="px-4 py-3 text-sm">{{ item.rpm }}</td>
    <td class="px-4 py-3 text-sm">{{ item.tpm }}</td>
    <td class="px-4 py-3 text-sm">{{ item.budget }}</td>
    <td class="px-4 py-3 text-sm">{{ item.reset_window }}</td>
    <td class="px-4 py-3 text-sm">
        {% if item.is_active %}
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-800">Active</span>
        {% else %}
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-800">Inactive</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-sm">
        <button hx-get="/dashboard/groups/{{ item.id }}"
                hx-target="#modal-container"
                class="text-blue-600 hover:underline mr-2">Edit</button>
        <button hx-delete="/dashboard/groups/{{ item.id }}"
                hx-target="#group-row-{{ item.id }}"
                hx-swap="outerHTML"
                hx-confirm="Delete this group? Keys in this group will be detached."
                class="text-red-600 hover:underline">Delete</button>
    </td>
</tr>

<div x-data="{ open: true, showKey: {{ show_key }} }" x-show="open" class="fixed inset-0 z-50 flex items-center justify-center">
    <div x-show="open" @click="open = false" class="absolute inset-0 bg-black opacity-40"></div>
    <div x-show="open" class="relative bg-white rounded-lg shadow-xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between p-4 border-b">
            <h2 class="text-lg font-bold">{{ is_edit }} API Key</h2>
            <button @click="open = false"
                    class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
        </div>
        {% if show_key %}
        <div class="p-4 bg-green-50 border-b">
            <div class="text-sm font-medium text-green-800 mb-1">Key created successfully!</div>
            <div class="text-xs text-gray-600 mb-2">Copy this key now — it won't be shown again:</div>
            <div class="bg-white border border-green-300 rounded px-3 py-2 font-mono text-sm break-all">{{ new_key }}</div>
        </div>
        {% endif %}
        <form {% if is_edit == "Edit" %}
                hx-put="/dashboard/keys/{{ key_id }}"
              {% else %}
                hx-post="/dashboard/keys"
              {% endif %}
                hx-target="#modal-container"
                class="p-4 space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Name *</label>
                <input type="text" name="name" value="{{ name }}" required
                       class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Group</label>
                <select name="groupId" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="" {% if group_id.is_empty() %}selected{% endif %}>No group</option>
                    {% for group in groups %}
                    <option value="{{ group.id }}" {% if group_id == group.id %}selected{% endif %}>{{ group.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">RPM</label>
                    <input type="number" name="rpm" value="{{ rpm }}"
                           placeholder="Unlimited"
                           class="w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">TPM</label>
                    <input type="number" name="tpm" value="{{ tpm }}"
                           placeholder="Unlimited"
                           class="w-full border border-gray-300 rounded px-3 py-2">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Budget ($)</label>
                    <input type="number" step="0.01" name="budgetUsd" value="{{ budget_usd }}"
                           placeholder="Unlimited"
                           class="w-full border border-gray-300 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Reset Window</label>
                    <select name="resetWindow" class="w-full border border-gray-300 rounded px-3 py-2">
                        <option value="" {% if reset_window.is_empty() %}selected{% endif %}>Default</option>
                        <option value="60s" {% if reset_window == "60s" %}selected{% endif %}>60 seconds</option>
                        <option value="1h" {% if reset_window == "1h" %}selected{% endif %}>1 hour</option>
                        <option value="24h" {% if reset_window == "24h" %}selected{% endif %}>24 hours</option>
                        <option value="7d" {% if reset_window == "7d" %}selected{% endif %}>7 days</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Expires At</label>
                <input type="datetime-local" name="expiresAt" value="{{ expires_at }}"
                       class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Allowed Models (comma-separated)</label>
                <input type="text" name="allowedModels" value="{{ allowed_models }}"
                       placeholder="e.g. openai/gpt-4o, anthropic/claude-3"
                       class="w-full border border-gray-300 rounded px-3 py-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Active</label>
                <select name="isActive" class="w-full border border-gray-300 rounded px-3 py-2">
                    <option value="true" {% if is_active %}selected{% endif %}>Yes</option>
                    <option value="false" {% if !is_active %}selected{% endif %}>No</option>
                </select>
            </div>
            <div class="flex justify-end space-x-2 pt-4">
                <button type="button" @click="open = false"
                        class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">Cancel</button>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">{{ is_edit }}</button>
            </div>
        </form>
    </div>
</div>

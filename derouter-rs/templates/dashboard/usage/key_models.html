<tr class="bg-gray-50 border-b">
    <td colspan="12" class="px-4 py-3">
        <div class="ml-8">
            <table class="min-w-full">
                <thead>
                    <tr class="text-xs text-gray-500">
                        <th class="px-2 py-1 text-left">Model</th>
                        <th class="px-2 py-1 text-right">Requests</th>
                        <th class="px-2 py-1 text-right">Input</th>
                        <th class="px-2 py-1 text-right">Output</th>
                        <th class="px-2 py-1 text-right">Cache Read</th>
                        <th class="px-2 py-1 text-right">Cost</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in models %}
                    <tr class="border-b border-gray-200">
                        <td class="px-2 py-1 text-sm font-mono">{{ m.model }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ m.requests }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ m.input }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ m.output }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ m.cache_read }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ m.cost }}</td>
                    </tr>
                    {% endfor %}
                    <tr class="font-semibold border-t-2 border-gray-300">
                        <td class="px-2 py-1 text-sm">Total</td>
                        <td class="px-2 py-1 text-sm text-right">{{ total_requests }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ total_input }}</td>
                        <td class="px-2 py-1 text-sm text-right">{{ total_output }}</td>
                        <td class="px-2 py-1 text-sm text-right">—</td>
                        <td class="px-2 py-1 text-sm text-right">{{ total_cost }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </td>
</tr>

<div>
    <!-- Filter form -->
    <form class="mb-4 flex flex-wrap gap-2 items-center"
          hx-get="/dashboard/usage/keys/table"
          hx-target="#usage-keys-table"
          hx-trigger="change"
          hx-include="this form">
        <input type="text" name="q" placeholder="Search keys..."
               class="border border-gray-300 rounded px-3 py-1.5 text-sm w-48">
        <select name="group" class="border border-gray-300 rounded px-3 py-1.5 text-sm">
            <option value="">All groups</option>
            {% for group in groups %}
            <option value="{{ group.id }}">{{ group.name }}</option>
            {% endfor %}
        </select>
        <input type="date" name="startDate" class="border border-gray-300 rounded px-3 py-1.5 text-sm">
        <input type="date" name="endDate" class="border border-gray-300 rounded px-3 py-1.5 text-sm">
    </form>

    <!-- Keys table -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full">
            <thead class="bg-gray-100 border-b">
                <tr>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Name</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Key</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Group</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">RPM</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">TPM</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Budget</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Peak TPM</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Requests</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">In/Out/Cache</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Cost</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Models</th>
                    <th class="px-3 py-2 text-left text-xs font-medium text-gray-600">Status</th>
                </tr>
            </thead>
            <tbody id="usage-keys-table">
                <!-- Filled by HTMX -->
            </tbody>
        </table>
    </div>
</div>

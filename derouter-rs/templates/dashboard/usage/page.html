{% extends "layout.html" %}
{% block title %}Usage — derouter{% endblock %}
{% block content %}
<div x-data="{ tab: 'overview', period: '24h', showRaw: false, expanded: null, drawerOpen: false }">
    <!-- Tab buttons -->
    <div class="flex space-x-1 mb-6 border-b">
        <button @click="tab='overview'"
                hx-get="/dashboard/usage/overview"
                hx-target="#usage-tab-content"
                hx-swap="innerHTML"
                :class="tab==='overview' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                class="px-4 py-2 border-b-2 font-medium text-sm">
            Overview
        </button>
        <button @click="tab='keys'"
                hx-get="/dashboard/usage/keys"
                hx-target="#usage-tab-content"
                hx-swap="innerHTML"
                :class="tab==='keys' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                class="px-4 py-2 border-b-2 font-medium text-sm">
            Keys
        </button>
        <button @click="tab='details'"
                hx-get="/dashboard/usage/details"
                hx-target="#usage-tab-content"
                hx-swap="innerHTML"
                :class="tab==='details' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                class="px-4 py-2 border-b-2 font-medium text-sm">
            Details
        </button>
    </div>

    <!-- Tab content container -->
    <div id="usage-tab-content">
        <!-- Loaded via HTMX on tab click -->
    </div>

    <!-- Detail drawer (Alpine-controlled) -->
    <div x-show="drawerOpen" x-transition class="fixed inset-0 z-40 flex justify-end" style="display:none;">
        <div @click="drawerOpen=false" class="absolute inset-0 bg-black opacity-30"></div>
        <div class="relative bg-white w-96 max-w-full h-full overflow-y-auto shadow-xl p-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Detail</h3>
                <button @click="drawerOpen=false" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
            </div>
            <div id="drawer"></div>
        </div>
    </div>
</div>
{% endblock %}

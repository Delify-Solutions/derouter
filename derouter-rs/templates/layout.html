<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}derouter{% endblock %}</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/htmx.min.js"></script>
    <script defer src="/alpine.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 h-full">
    <div class="flex h-full">
        <aside class="w-64 bg-gray-900 text-gray-100 flex-shrink-0 hidden md:block">
            <div class="p-4">
                <a href="/dashboard" class="text-xl font-bold text-white">derouter</a>
            </div>
            <nav class="mt-4">
                <a href="/dashboard" class="block px-4 py-2 hover:bg-gray-800 rounded">Overview</a>
                <a href="/dashboard/providers" class="block px-4 py-2 hover:bg-gray-800 rounded">Providers</a>
                <a href="/dashboard/combos" class="block px-4 py-2 hover:bg-gray-800 rounded">Combos</a>
                <a href="/dashboard/keys" class="block px-4 py-2 hover:bg-gray-800 rounded">API Keys</a>
                <a href="/dashboard/groups" class="block px-4 py-2 hover:bg-gray-800 rounded">Groups</a>
                <a href="/dashboard/pricing" class="block px-4 py-2 hover:bg-gray-800 rounded">Pricing</a>
                <a href="/dashboard/usage" class="block px-4 py-2 hover:bg-gray-800 rounded">Usage</a>
                <hr class="my-2 border-gray-700">
                <a href="/usage" class="block px-4 py-2 hover:bg-gray-800 rounded">Public Usage</a>
                <a href="/logout" class="block px-4 py-2 hover:bg-gray-800 rounded">Logout</a>
            </nav>
        </aside>
        <main class="flex-1 overflow-auto p-6">
            {% block content %}{{ content }}{% endblock %}
        </main>
    </div>
</body>
</html>

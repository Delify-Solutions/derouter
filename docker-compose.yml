services:
  derouter:
    build: .
    image: derouter:local
    container_name: derouter
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - derouter-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://derouter-rs:20128
    depends_on:
      - derouter-rs

  derouter-rs:
    build: ./derouter-rs
    image: derouter-rs:local
    container_name: derouter-rs
    restart: always
    ports:
      - "20129:20128"
    volumes:
      - derouter-data:/app/data
    environment:
      DATA_DIR: /app/data
      CORS_ORIGIN: "http://localhost:3000,http://localhost:20127,http://derouter:20127"

volumes:
  derouter-data:
    name: derouter-data

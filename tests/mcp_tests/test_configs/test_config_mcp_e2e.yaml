general_settings:
  master_key: sk-1234

derouter_settings:
  drop_params: true

model_list:
  - model_name: openai-gpt-4o-mini
    derouter_params:
      model: gpt-4o-mini
  - model_name: anthropic-claude-haiku-4-5
    derouter_params:
      model: anthropic/claude-haiku-4-5

mcp_servers:
  math_stdio:
    transport: stdio
    command: python3
    args:
      - tests/mcp_tests/mcp_server.py
    allow_all_keys: true  # Needed for master_key auth when DB/object_permission not used
  math_streamable_http:
    transport: http
    url: http://127.0.0.1:0/mcp
    allow_all_keys: true
  math_restricted:
    transport: http
    url: http://127.0.0.1:0/mcp
